services:
  - type: web
    name: investledger-api
    runtime: docker
    plan: free
    rootDir: api
    dockerfilePath: ./Dockerfile
    envVars:
      - key: INVESTLEDGER_API_KEY
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
