spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/investledger
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

investledger:
  api-key: dev-investledger-key
