services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: investledger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d investledger"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/investledger
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      INVESTLEDGER_API_KEY: ${INVESTLEDGER_API_KEY:-dev-investledger-key}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  db-data:
